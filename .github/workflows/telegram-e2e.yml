name: Telegram E2E
on:
  workflow_dispatch:
jobs:
  telegram-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python ops/telegram/e2e.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TEST_TELEGRAM_USER_ID: ${{ secrets.TEST_TELEGRAM_USER_ID }}
          API_URL: ${{ vars.API_URL }}
          MINI_APP_URL: ${{ vars.MINI_APP_URL }}
