name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_fuel_test
          POSTGRES_USER: crm_fuel
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm_fuel -d crm_fuel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: pip install -e ".[dev]"
      - run: pip-audit
      - run: ruff check .
      - run: mypy app
      - run: pytest
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://crm_fuel:test-only-password@localhost:5432/crm_fuel_test
      - run: python tests/postgres_concurrency.py
        env:
          DATABASE_URL: postgresql+psycopg://crm_fuel:test-only-password@localhost:5432/crm_fuel_test
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: sh -n ops/backup/backup.sh
      - run: sh -n ops/backup/run.sh
      - run: sh -n ops/backup/restore.sh
      - run: sh -n ops/backup/rehearse.sh
      - run: python -m py_compile ops/telegram/e2e.py ops/load/read_load.py
      - run: docker compose up -d postgres
      - run: >-
          docker compose exec -T postgres psql -U crm_fuel -d crm_fuel
          -c "CREATE TABLE backup_rehearsal (marker text NOT NULL);
          INSERT INTO backup_rehearsal VALUES ('crm-fuel-backup-ok');"
      - run: docker compose run --rm backup /bin/sh /opt/backup/backup.sh
      - run: docker compose exec -T postgres createdb -U crm_fuel crm_fuel_restore
      - run: >-
          docker compose run --rm -e RESTORE_DATABASE=crm_fuel_restore
          backup /bin/sh /opt/backup/rehearse.sh
